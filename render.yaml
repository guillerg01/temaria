services:
  - type: web
    name: temaria
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: SITE_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AGENTROUTER_BASE_URL
        value: https://agentrouter.org/v1
      - key: AGENTROUTER_MODEL
        value: gpt-5.6-sol
      - key: AGENTROUTER_USER_AGENT
        value: codex_cli_rs/0.114.0
      - key: TEMARIA_CORPUS_PATH
        value: /opt/render/project/src/private-data/corpus.enc
      - key: TEMARIA_ASSESSMENTS_PATH
        value: /opt/render/project/src/private-data/official-assessments.enc
      - key: TEMARIA_DATA_KEY
        sync: false
